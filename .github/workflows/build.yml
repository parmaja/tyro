name: build-and-smoke

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out Tyro
        uses: actions/checkout@v4
        with:
          path: tyro

      # tyro.lpi compiles against the sibling minilib and miniLua packages,
      # so they must sit next to the tyro folder, not inside it.
      - name: Check out minilib
        uses: actions/checkout@v4
        with:
          repository: parmaja/minilib
          path: minilib

      - name: Check out miniLua
        uses: actions/checkout@v4
        with:
          repository: parmaja/miniLua
          path: lua

      # Lazarus supplies lazbuild and the LCL packages required by tyro.lpi.
      - name: Install Lazarus
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable

      # FPC 3.3.x (trunk) is not bundled with any stable Lazarus release, and
      # Tyro is developed against it. Use the official daily win64 snapshot
      # and explicitly point lazbuild at that compiler. The snapshot ships no
      # fpc.cfg, so generate one that lists its prebuilt unit directories.
      - name: Install FPC 3.3.1 (trunk snapshot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://downloads.freepascal.org/fpc/snapshot/trunk/x86_64-win64/fpc-3.3.1.x86_64-win64.built.on.i386-win32.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'fpc33.zip'
          $root = Join-Path $env:RUNNER_TEMP 'fpc33'
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $root -Force

          $units = Join-Path $root 'units\x86_64-win64'
          Get-ChildItem $units -Directory |
            ForEach-Object { "-Fu$($_.FullName)" } |
            Set-Content -Path (Join-Path $root 'bin\i386-win32\fpc.cfg') -Encoding ascii

          $pp = Join-Path $root 'bin\i386-win32\ppcrossx64.exe'
          & $pp -iV

      - name: Build Tyro (FPC 3.3.1, Debug)
        working-directory: tyro/src
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pp = Join-Path $env:RUNNER_TEMP 'fpc33\bin\i386-win32\ppcrossx64.exe'
          & lazbuild --compiler=$pp --build-all --build-mode=Debug tyro.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The runtime DLLs are intentionally not committed (see .gitignore).
      # Set repository variables RAYLIB_URL and CHIPMUNK_URL to zip files
      # containing the win64 DLLs to enable the smoke step. Without them the
      # build still runs, but the game cannot launch and smoke is skipped.
      - name: Fetch runtime DLLs
        if: vars.RAYLIB_URL != ''
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ vars.RAYLIB_URL }}" -OutFile raylib.zip
          Expand-Archive raylib.zip -DestinationPath tyro/bin -Force
          if ("${{ vars.CHIPMUNK_URL }}" -ne "") {
            Invoke-WebRequest -Uri "${{ vars.CHIPMUNK_URL }}" -OutFile chipmunk.zip
            Expand-Archive chipmunk.zip -DestinationPath tyro/bin -Force
          }

      - name: Smoke tests
        if: vars.RAYLIB_URL != ''
        working-directory: tyro
        run: powershell -ExecutionPolicy Bypass -File tests/run_roadmap02.ps1
